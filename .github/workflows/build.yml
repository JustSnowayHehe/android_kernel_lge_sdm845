name: Build LG Velvet 4G Kernel (Android 17 Backport)

on:
  push:
    branches: [ lineage-24.0 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install build dependencies and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git libelf-dev libssl-dev lld llvm python3 zip

      - name: Compile Kernel (lineageos_caymanslm_defconfig)
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out ARCH=arm64 lineageos_caymanslm_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip CLANG_TRIPLE=aarch64-linux-gnu- CLANG_TRIPLE_ARM32=arm-linux-gnueabi- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- Image.gz-dtb

      - name: Upload compiled Image.gz-dtb
        uses: actions/upload-artifact@v4
        with:
          name: caymanslm-kernel-a17-untested
          path: out/arch/arm64/boot/Image.gz-dtb
